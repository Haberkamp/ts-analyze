name: Release
on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release that is already publishing; queue the next one instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no NPM_TOKEN secret needed.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 24.18.0 is the first Node 24 release whose bundled npm (11.16) supports `npm stage publish`.
          node-version: "^24.18.0"
          registry-url: "https://registry.npmjs.org"
          # Never restore a cache in a job that publishes.
          package-manager-cache: false

      - run: npm ci

      - run: npm --version

      # Uploads to npm's staging area; approve it with 2FA under "Staged Packages" on npmjs.com.
      # Trusted publishing adds the provenance attestation automatically.
      - run: npm stage publish --access public
